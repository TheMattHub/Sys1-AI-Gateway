name: tests
# Runs when code or tests change, not for documents or study data.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "bench/**"
      - "calibration/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "bench/**"
      - "calibration/**"
      - "**/*.md"
  workflow_dispatch:
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Stdlib only; the bench scripts need GPUs and models and are not run here.
      - run: python -m unittest discover -s tests -v
